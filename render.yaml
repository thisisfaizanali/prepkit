services:
  - type: web
    name: prepkit-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start -w @prepkit/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ALLOW_PRIVATE_URLS
        value: "false"
      - key: MONGODB_DB
        value: prepkit
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
